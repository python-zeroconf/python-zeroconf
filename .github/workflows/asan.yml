name: ASan fuzz

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Hypothesis profile"
        default: "long"
        type: choice
        options:
          - ci
          - long

jobs:
  asan-fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Install poetry
        run: uv tool install poetry
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install dependencies with AddressSanitizer instrumentation
        env:
          REQUIRE_CYTHON: 1
          CFLAGS: "-fsanitize=address -g -O1"
          LDFLAGS: "-fsanitize=address"
        run: poetry install --only=main,dev
      - name: Fuzz the parser under ASan
        env:
          HYPOTHESIS_PROFILE: ${{ inputs.profile }}
        run: |
          export LD_PRELOAD=$(gcc -print-file-name=libasan.so)
          export ASAN_OPTIONS=detect_leaks=0:halt_on_error=1
          poetry run pytest --timeout=1800 -v --no-cov tests/test_fuzz_incoming.py tests/test_protocol.py
